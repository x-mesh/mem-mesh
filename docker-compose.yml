services:
  # Production service
  mem-mesh:
    build:
      context: .
      dockerfile: Dockerfile
    image: xmesh/mem-mesh:latest
    container_name: mem-mesh-prod
    # SECURITY: do NOT use `network_mode: host` — it binds 0.0.0.0 directly on
    # the host with no token by default, exposing unauthenticated hook write
    # endpoints (POST /api/hooks/claude/*) to the network. We publish to the
    # host loopback only. To expose remotely, change the published address to
    # 0.0.0.0:8000:8000 — a hook token is enforced (see MEM_MESH_HOOK_TOKEN).
    ports:
      - "8000:8000"
    # Run as the HOST user so the bind-mounted ./logs (owned by whoever runs
    # this) is writable — the non-root image user (memmesh, 1000) otherwise
    # can't write a host dir owned by root/your-uid, and uvicorn's access_file
    # handler is FATAL on failure (crash loop). Pass the host IDs per machine:
    #   ubuntu root server → put HOST_UID=0 / HOST_GID=0 in .env
    #   mac/linux dev       → HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up
    # Falls back to the image user (1000) if unset. The named volumes below stay
    # writable for any host UID on a root server (root) — keep prod on root, or
    # chown the volumes if you pin a non-root, non-1000 user.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      # Data + model cache stay in NAMED volumes (initialized memmesh:1000 from
      # the Dockerfile chown) so the SQLite DB and the 2GB model survive across
      # `up`/recreate and aren't exposed as raw host files. Back up with:
      #   docker compose cp mem-mesh:/app/data/memories.db ./backup.db
      - mem-mesh-data:/app/data
      - model-cache:/home/memmesh/.cache/huggingface
      # Logs are HOST-BOUND so you can `tail -f logs/mem-mesh.log` directly.
      # Requires the `user:` above to own ./logs (hence host-uid). access.log is
      # written here too (LOG_OUTPUT=both → also on `docker compose logs`).
      - ./logs:/app/logs
    environment:
      - MEM_MESH_DATABASE_PATH=/app/data/memories.db
      - MEM_MESH_LOG_LEVEL=INFO
      - MEM_MESH_LOG_FORMAT=text
      - MEM_MESH_LOG_OUTPUT=both
      - MEM_MESH_LOG_FILE=/app/logs/mem-mesh.log
      # A numeric `user:` override has no /etc/passwd home, so pin HOME to the
      # image user's home — its .cache/huggingface is the model-cache mount, so
      # the cached model is reused instead of re-downloaded.
      - HOME=/home/memmesh
      # Must be 0.0.0.0 so the published port reaches the app inside the
      # container. Network exposure is controlled by the `ports:` mapping above,
      # not by this value. Because the app sees a non-loopback bind, it
      # fails closed without a hook token (below).
      - MEM_MESH_SERVER_HOST=0.0.0.0
      - MEM_MESH_SERVER_PORT=8000
      # Single worker: each worker is a separate process with its own in-memory
      # cache (incoherent across workers — stale reads up to cache TTL) and its
      # own SQLite write connection (WAL lock contention). Keep at 1 until a
      # shared cache / server DB engine is in place. (red-team multi-worker)
      - MEM_MESH_SERVER_WORKERS=1
      # Shared secret for hook write endpoints. OPTIONAL: if left empty the
      # server auto-generates one at startup and persists it to
      # ./data/hook_token (the mounted volume), so `docker compose up` always
      # starts. Set it explicitly in .env to pin a known value, e.g.
      # `MEM_MESH_HOOK_TOKEN=$(openssl rand -hex 32)`. Either way, hooks must
      # send it as `Authorization: Bearer <token>`; retrieve/rotate the
      # generated token from the dashboard Security page.
      - MEM_MESH_HOOK_TOKEN=${MEM_MESH_HOOK_TOKEN:-}
      # CORS origins: set this to your public domain when running behind a reverse
      # proxy (nginx/caddy). Default only allows localhost — WebSocket and API calls
      # from a different origin will be blocked without this.
      # Example: MEM_MESH_CORS_ORIGINS=https://your-domain.com
      - MEM_MESH_CORS_ORIGINS=${MEM_MESH_CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      # Embedding model: defaults to nlpai-lab/KURE-v1 (Korean-tuned, 1024-dim)
      # Override by uncommenting and setting MEM_MESH_EMBEDDING_MODEL below.
      # - MEM_MESH_EMBEDDING_MODEL=intfloat/multilingual-e5-large
      # - MEM_MESH_EMBEDDING_DIM=1024

    restart: unless-stopped
    # Resource ceiling: the KURE-v1 embedding model (~2.2GB) + torch live in
    # RAM. Without a limit a load spike drives the host OOM killer to reap the
    # whole container. Measure real RSS and tune; these are a safe starting
    # point for a single worker. (mem_limit/cpus are honored by `docker compose`
    # v2 outside swarm; deploy.resources only applies under swarm.)
    mem_limit: 4g
    mem_reservation: 2g
    cpus: 2.0
    healthcheck:
      # /api/ready returns 503 until the model is usable (the old /health probe
      # hit a non-existent path — see Dockerfile note).
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Relay/maintenance background worker — drains relay outbox, maintenance
  # queue (enrich/improve), reconcile, and scheduled overview refresh in a
  # SEPARATE process so LLM batches never compete with API latency. Shares the
  # SQLite volume with the web service (WAL mode + busy_timeout make the
  # two-process access safe; keep it to exactly these two).
  # NOTE: without this container, batch enrich / overview schedules / archive
  # prune simply never run — the queues fill and sit idle.
  mem-mesh-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: xmesh/mem-mesh:latest
    container_name: mem-mesh-worker
    command: ["python", "-m", "app.cli.main", "relay", "worker"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      # Same named volumes as the web service: one DB, one model cache.
      - mem-mesh-data:/app/data
      - model-cache:/home/memmesh/.cache/huggingface
      - ./logs:/app/logs
    environment:
      - MEM_MESH_DATABASE_PATH=/app/data/memories.db
      - MEM_MESH_LOG_LEVEL=INFO
      - MEM_MESH_LOG_FORMAT=text
      - MEM_MESH_LOG_OUTPUT=both
      # Separate log file so worker lines don't interleave with API access logs.
      - MEM_MESH_LOG_FILE=/app/logs/mem-mesh-worker.log
      - HOME=/home/memmesh
      # Cross-container WS bridge: enrich/overview completion events POST to the
      # web service (service name, not localhost) so the dashboard notification
      # center shows them. Auth = the shared hook token from the data volume.
      - MEM_MESH_NOTIFY_BASE_URL=http://mem-mesh:8000
      - MEM_MESH_HOOK_TOKEN=${MEM_MESH_HOOK_TOKEN:-}
    depends_on:
      mem-mesh:
        condition: service_healthy
    restart: unless-stopped
    # The worker loads the same embedding model for relay materialization —
    # budget RAM like the web service.
    mem_limit: 4g
    mem_reservation: 2g
    cpus: 2.0

volumes:
  model-cache:
    name: mem-mesh-model-cache
  mem-mesh-data:
    name: mem-mesh-data
